<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tes Chart 13 - Tap to Place & Dynamic Trade Line</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; font-family: sans-serif; overflow: hidden; }
        #chart-wrapper { position: relative; width: 100vw; height: 85vh; background-color: #1e1e1e; }
        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        #chart-container { position: relative; width: 100%; height: 100%; z-index: 2; }
        #fg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
        
        #toolbar { padding: 10px; display: flex; gap: 5px; background: #2B2B43; z-index: 10; position: relative; overflow-x: auto; }
        .btn { background: #363A45; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .btn.active { background: #2962FF; }
        .btn-long { background: #26a69a; }
        .btn-short { background: #ef5350; }
        .btn-danger { background: #ef5350; margin-left: auto; }
    </style>
    
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

    <div id="toolbar">
        <button class="btn" id="btn-line">Garis</button>
        <button class="btn" id="btn-box">Kotak</button>
        <button class="btn btn-long" id="btn-long">Long</button>
        <button class="btn btn-short" id="btn-short">Short</button>
        <button class="btn btn-danger" id="btn-clear">Hapus</button>
    </div>

    <div id="chart-wrapper">
        <canvas id="bg-canvas"></canvas>
        <div id="chart-container"></div>
        <canvas id="fg-canvas"></canvas>
    </div>

    <script>
        // ==========================================
        // 1. SETUP CHART & DATA
        // ==========================================
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: container.clientHeight,
            layout: { background: { color: 'transparent' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#485c7b', rightOffset: 10, barSpacing: 8 },
            rightPriceScale: { autoScale: false, borderColor: '#485c7b' },
            handleScroll: { horzTouchDrag: true, vertTouchDrag: true },
            handleScale: { axisPressedMouseMove: { time: true, price: true }, pinch: true },
            crosshair: { mode: LightweightCharts.CrosshairMode.Hidden }
        });

        const series = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        const data = [];
        let baseTime = 1293840000;
        let price = 1400;
        for (let i = 0; i < 1000; i++) {
            if (i % 100 === 0 && i !== 0) baseTime += 48 * 60 * 60;
            else baseTime += 5 * 60;
            price = price + (Math.random() - 0.5) * 2;
            data.push({ time: baseTime, open: price, high: price + 1, low: price - 1, close: price + (Math.random() - 0.5) });
        }
        series.setData(data);
        chart.timeScale().setVisibleLogicalRange({ from: data.length - 50, to: data.length + 10 });

        // ==========================================
        // 2. STATE & CANVAS SETUP
        // ==========================================
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const fgCanvas = document.getElementById('fg-canvas');
        const fgCtx = fgCanvas.getContext('2d');
        
        let drawings = []; 
        let currentTool = 'pan';
        let isDrawing = false;
        let selectedDrawing = null; 
        let dragHandle = null; 
        
        let dragStartLogical = null;
        let dragStartPrice = null;
        let initialObjState = null;

        let currentMouseX = null;
        let currentMouseY = null;

        function resizeCanvas() {
            bgCanvas.width = fgCanvas.width = container.clientWidth;
            bgCanvas.height = fgCanvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==========================================
        // 3. RENDER LOOP
        // ==========================================
        function render() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            fgCtx.clearRect(0, 0, fgCanvas.width, fgCanvas.height);
            
            drawings.forEach(d => {
                if (d.type.startsWith('position')) {
                    drawPositionBg(d);
                } else {
                    drawShapeFg(d, d === selectedDrawing);
                }
                
                if (d === selectedDrawing) {
                    drawHandlesFg(d);
                    drawLabelsFg(d);
                }
            });

            if (isDrawing && selectedDrawing) {
                if (selectedDrawing.type.startsWith('position')) {
                    drawPositionBg(selectedDrawing);
                } else {
                    drawShapeFg(selectedDrawing, true);
                }
                drawHandlesFg(selectedDrawing);
                drawLabelsFg(selectedDrawing);
            }

            if (currentMouseX !== null && currentMouseY !== null) {
                drawCrosshair();
            }
            requestAnimationFrame(render);
        }
        render();

        // ==========================================
        // 4. FUNGSI GAMBAR & LOGIKA TRADE
        // ==========================================
        function getX(logical) { return chart.timeScale().logicalToCoordinate(logical); }
        function getY(price) { return series.priceToCoordinate(price); }

        // Logika Mencari Candle yang Menyentuh Entry & TP/SL
        function calculateTradeLine(d) {
            let entryLogical = Math.round(d.start.logical);
            let entryPrice = d.start.price;
            let isLong = d.type === 'position-long';
            
            // 1. Cari candle pertama yang menyentuh Entry (Body/Wick)
            let hitEntryIndex = null;
            for (let i = Math.max(0, entryLogical); i < data.length; i++) {
                let c = data[i];
                if (c.low <= entryPrice && c.high >= entryPrice) {
                    hitEntryIndex = i;
                    break;
                }
            }

            if (hitEntryIndex === null) return null; // Belum ada candle yang menyentuh Entry

            // 2. Cari candle pertama yang menyentuh TP atau SL (Setelah Entry tersentuh)
            let exitIndex = null;
            let exitPrice = null;
            for (let i = hitEntryIndex; i < data.length; i++) {
                let c = data[i];
                if (isLong) {
                    if (c.high >= d.tp) { exitIndex = i; exitPrice = d.tp; break; }
                    if (c.low <= d.sl) { exitIndex = i; exitPrice = d.sl; break; }
                } else {
                    if (c.low <= d.tp) { exitIndex = i; exitPrice = d.tp; break; }
                    if (c.high >= d.sl) { exitIndex = i; exitPrice = d.sl; break; }
                }
            }

            if (exitIndex === null) return null; // Belum ada TP/SL yang tersentuh

            return { startLogical: hitEntryIndex, endLogical: exitIndex, endPrice: exitPrice };
        }

        function drawPositionBg(d) {
            const x1 = getX(d.start.logical);
            const x2 = getX(d.end.logical); // Kotak independen mengikuti handle kanan
            const yEntry = getY(d.start.price);
            const yTP = getY(d.tp);
            const ySL = getY(d.sl);

            if (x1 === null || x2 === null || yEntry === null || yTP === null || ySL === null) return;

            // Gambar Kotak TP & SL (Independen)
            bgCtx.fillStyle = 'rgba(38, 166, 154, 0.2)';
            bgCtx.beginPath(); bgCtx.rect(x1, yTP, x2 - x1, yEntry - yTP); bgCtx.fill();

            bgCtx.fillStyle = 'rgba(239, 83, 80, 0.2)';
            bgCtx.beginPath(); bgCtx.rect(x1, yEntry, x2 - x1, ySL - yEntry); bgCtx.fill();

            // Garis Entry Horizontal
            bgCtx.strokeStyle = '#ffffff';
            bgCtx.lineWidth = 1;
            bgCtx.setLineDash([5, 5]);
            bgCtx.beginPath(); bgCtx.moveTo(x1, yEntry); bgCtx.lineTo(x2, yEntry); bgCtx.stroke();

            // Garis Simulasi Trade (Jika ada candle yang menyentuh Entry & TP/SL)
            const tradeInfo = calculateTradeLine(d);
            if (tradeInfo) {
                const xStart = getX(tradeInfo.startLogical);
                const xEnd = getX(tradeInfo.endLogical);
                const yEnd = getY(tradeInfo.endPrice);
                
                // Garis dari candle yang menyentuh Entry ke titik TP/SL
                bgCtx.beginPath(); bgCtx.moveTo(xStart, yEntry); bgCtx.lineTo(xEnd, yEnd); bgCtx.stroke();
            }
            bgCtx.setLineDash([]);
        }

        function drawShapeFg(d, isSelected) {
            const x1 = getX(d.start.logical); const y1 = getY(d.start.price);
            const x2 = getX(d.end.logical); const y2 = getY(d.end.price);

            if (x1 === null || y1 === null || x2 === null || y2 === null) return;

            fgCtx.lineWidth = isSelected ? 3 : 2;
            fgCtx.strokeStyle = isSelected ? '#FFD700' : '#2962FF'; 

            if (d.type === 'line') {
                fgCtx.beginPath(); fgCtx.moveTo(x1, y1); fgCtx.lineTo(x2, y2); fgCtx.stroke();
            } else if (d.type === 'box') {
                fgCtx.beginPath(); fgCtx.rect(x1, y1, x2 - x1, y2 - y1); fgCtx.stroke();
                fgCtx.fillStyle = 'rgba(41, 98, 255, 0.1)'; fgCtx.fill();
            }
        }

        function drawHandlesFg(d) {
            fgCtx.fillStyle = '#FFD700';
            
            if (d.type.startsWith('position')) {
                let x1 = getX(d.start.logical); let yEntry = getY(d.start.price);
                let x2 = getX(d.end.logical); let yTP = getY(d.tp); let ySL = getY(d.sl);
                
                // Entry (Kiri)
                fgCtx.beginPath(); fgCtx.arc(x1, yEntry, 6, 0, Math.PI * 2); fgCtx.fill();
                // TP (Kanan Atas)
                fgCtx.beginPath(); fgCtx.arc(x2, yTP, 6, 0, Math.PI * 2); fgCtx.fill();
                // SL (Kanan Bawah)
                fgCtx.beginPath(); fgCtx.arc(x2, ySL, 6, 0, Math.PI * 2); fgCtx.fill();
                // Exit/Time (Kanan Tengah)
                fgCtx.beginPath(); fgCtx.arc(x2, yEntry, 6, 0, Math.PI * 2); fgCtx.fill();

                // Center Handle (Kotak)
                let cx = (x1 + x2) / 2;
                let cy = (yEntry + yTP + ySL) / 3;
                fgCtx.fillRect(cx - 5, cy - 5, 10, 10);

            } else {
                const x1 = getX(d.start.logical); const y1 = getY(d.start.price);
                const x2 = getX(d.end.logical); const y2 = getY(d.end.price);
                fgCtx.beginPath(); fgCtx.arc(x1, y1, 6, 0, Math.PI * 2); fgCtx.fill(); 
                fgCtx.beginPath(); fgCtx.arc(x2, y2, 6, 0, Math.PI * 2); fgCtx.fill(); 
                
                let cx = (x1 + x2) / 2; let cy = (y1 + y2) / 2;
                fgCtx.fillRect(cx - 5, cy - 5, 10, 10);
            }
        }

        function drawLabelsFg(d) {
            fgCtx.font = '11px sans-serif';
            fgCtx.fillStyle = '#ffffff';
            fgCtx.textAlign = 'left';
            fgCtx.textBaseline = 'middle';

            if (d.type.startsWith('position')) {
                let x2 = getX(d.end.logical); let yTP = getY(d.tp); let ySL = getY(d.sl); let yEntry = getY(d.start.price);

                if (yTP !== null) fgCtx.fillText(d.tp.toFixed(2), x2 + 12, yTP);
                if (ySL !== null) fgCtx.fillText(d.sl.toFixed(2), x2 + 12, ySL);
                if (yEntry !== null) fgCtx.fillText(d.start.price.toFixed(2), x2 + 12, yEntry);
            } else {
                const x2 = getX(d.end.logical); const y2 = getY(d.end.price);
                if (y2 !== null) fgCtx.fillText(d.end.price.toFixed(2), x2 + 12, y2);
            }
        }

        function drawCrosshair() {
            fgCtx.save();
            fgCtx.strokeStyle = '#888888';
            fgCtx.lineWidth = 1;
            fgCtx.setLineDash([5, 5]); 
            fgCtx.beginPath(); fgCtx.moveTo(currentMouseX, 0); fgCtx.lineTo(currentMouseX, fgCanvas.height); fgCtx.stroke();
            fgCtx.beginPath(); fgCtx.moveTo(0, currentMouseY); fgCtx.lineTo(fgCanvas.width, currentMouseY); fgCtx.stroke();
            fgCtx.restore();

            let price = series.coordinateToPrice(currentMouseY);
            let time = chart.timeScale().coordinateToTime(currentMouseX);
            
            if (price !== null && time !== null) {
                fgCtx.fillStyle = '#363A45';
                fgCtx.fillRect(fgCanvas.width - 65, currentMouseY - 10, 65, 20);
                fgCtx.fillStyle = '#d1d4dc';
                fgCtx.font = '12px sans-serif';
                fgCtx.textAlign = 'center';
                fgCtx.fillText(price.toFixed(2), fgCanvas.width - 32, currentMouseY + 4);

                let date = new Date(time * 1000);
                let timeStr = date.getUTCHours().toString().padStart(2, '0') + ':' + date.getUTCMinutes().toString().padStart(2, '0');
                fgCtx.fillStyle = '#363A45';
                fgCtx.fillRect(currentMouseX - 25, fgCanvas.height - 25, 50, 20);
                fgCtx.fillStyle = '#d1d4dc';
                fgCtx.fillText(timeStr, currentMouseX, fgCanvas.height - 10);
            }
        }

        // ==========================================
        // 5. UTILITAS HIT-TESTING
        // ==========================================
        function getCoords(e) {
            const rect = container.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function getChartCoords(x, y) {
            const logical = chart.timeScale().coordinateToLogical(x);
            const price = series.coordinateToPrice(y);
            if (logical === null || price === null) return null;
            return { logical, price };
        }

        function checkHandleHit(x, y) {
            if (!selectedDrawing) return null;
            const d = selectedDrawing;

            let cx, cy;
            if (d.type.startsWith('position')) {
                let x1 = getX(d.start.logical); let yEntry = getY(d.start.price);
                let x2 = getX(d.end.logical); let yTP = getY(d.tp); let ySL = getY(d.sl);
                cx = (x1 + x2) / 2; cy = (yEntry + yTP + ySL) / 3;
            } else {
                const x1 = getX(d.start.logical); const y1 = getY(d.start.price);
                const x2 = getX(d.end.logical); const y2 = getY(d.end.price);
                cx = (x1 + x2) / 2; cy = (y1 + y2) / 2;
            }
            
            if (Math.hypot(x - cx, y - cy) < 30) return 'center';

            if (d.type.startsWith('position')) {
                const x1 = getX(d.start.logical); const yEntry = getY(d.start.price);
                const x2 = getX(d.end.logical); const yTP = getY(d.tp); const ySL = getY(d.sl);

                if (Math.hypot(x - x1, y - yEntry) < 30) return 'entry';
                if (Math.hypot(x - x2, y - yTP) < 30) return 'tp';
                if (Math.hypot(x - x2, y - ySL) < 30) return 'sl';
                if (Math.hypot(x - x2, y - yEntry) < 30) return 'exit';
            } else {
                const x1 = getX(d.start.logical); const y1 = getY(d.start.price);
                const x2 = getX(d.end.logical); const y2 = getY(d.end.price);
                if (Math.hypot(x - x1, y - y1) < 30) return 'start';
                if (Math.hypot(x - x2, y - y2) < 30) return 'end';
            }
            return null;
        }

        function checkObjectHit(x, y) {
            for (let i = drawings.length - 1; i >= 0; i--) {
                const d = drawings[i];
                const x1 = getX(d.start.logical); const y1 = getY(d.start.price);
                
                if (d.type.startsWith('position')) {
                    let x2 = getX(d.end.logical);
                    const yTP = getY(d.tp); const ySL = getY(d.sl);
                    const minX = Math.min(x1, x2); const maxX = Math.max(x1, x2);
                    const minY = Math.min(yTP, ySL, y1); const maxY = Math.max(yTP, ySL, y1);
                    if (x > minX && x < maxX && y > minY && y < maxY) return d;
                } else {
                    const x2 = getX(d.end.logical); const y2 = getY(d.end.price);
                    if (x1 === null || y1 === null || x2 === null || y2 === null) continue;
                    if (d.type === 'box') {
                        const minX = Math.min(x1, x2); const maxX = Math.max(x1, x2);
                        const minY = Math.min(y1, y2); const maxY = Math.max(y1, y2);
                        if (x > minX && x < maxX && y > minY && y < maxY) return d;
                    } else if (d.type === 'line') {
                        if (Math.abs((y2 - y1)*x - (x2 - x1)*y + x2*y1 - y2*x1) / Math.hypot(y2-y1, x2-x1) < 20) return d;
                    }
                }
            }
            return null;
        }

        // ==========================================
        // 6. EVENT LISTENERS
        // ==========================================
        container.addEventListener('touchstart', handleStart, { passive: false });
        container.addEventListener('mousedown', handleStart);

        function handleStart(e) {
            const { x, y } = getCoords(e);
            currentMouseX = x; currentMouseY = y;

            if (currentTool !== 'pan') {
                e.preventDefault(); 
                const coords = getChartCoords(x, y);
                if (coords) {
                    // KHUSUS POSISI: Tap-to-Place (Langsung jadi, tanpa drag)
                    if (currentTool === 'position-long' || currentTool === 'position-short') {
                        let isLong = currentTool === 'position-long';
                        let tp = isLong ? coords.price + 5 : coords.price - 5;
                        let sl = isLong ? coords.price - 5 : coords.price + 5;
                        let endLogical = coords.logical + 20; // Default lebar 20 bar
                        
                        let newPos = {
                            type: currentTool,
                            start: coords,
                            end: { logical: endLogical, price: coords.price },
                            tp: tp,
                            sl: sl
                        };
                        drawings.push(newPos);
                        selectedDrawing = newPos;
                        setTool('pan'); // Langsung balik ke mode pan
                    } else {
                        // Untuk Garis & Kotak: Tetap pakai drag
                        isDrawing = true;
                        selectedDrawing = { type: currentTool, start: coords, end: coords };
                    }
                }
                return;
            }

            const hitHandle = checkHandleHit(x, y);
            if (hitHandle) {
                dragHandle = hitHandle;
                e.preventDefault(); 
                chart.applyOptions({ handleScroll: false, handleScale: false }); 
                
                const coords = getChartCoords(x, y);
                dragStartLogical = coords.logical;
                dragStartPrice = coords.price;
                initialObjState = JSON.parse(JSON.stringify(selectedDrawing));
                return;
            }

            const hitObj = checkObjectHit(x, y);
            if (hitObj) {
                selectedDrawing = hitObj; 
                e.preventDefault(); 
                return;
            }

            selectedDrawing = null; 
        }

        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('mousemove', handleMove);

        function handleMove(e) {
            const { x, y } = getCoords(e);
            currentMouseX = x; currentMouseY = y;

            if (isDrawing && selectedDrawing) {
                e.preventDefault();
                const coords = getChartCoords(x, y);
                if (coords) {
                    selectedDrawing.end = coords;
                }
            } else if (dragHandle && selectedDrawing) {
                e.preventDefault();
                const coords = getChartCoords(x, y);
                if (!coords) return;

                if (dragHandle === 'center') {
                    const deltaLogical = coords.logical - dragStartLogical;
                    const deltaPrice = coords.price - dragStartPrice;

                    if (selectedDrawing.type.startsWith('position')) {
                        selectedDrawing.start.logical = initialObjState.start.logical + deltaLogical;
                        selectedDrawing.start.price = initialObjState.start.price + deltaPrice;
                        selectedDrawing.end.logical = initialObjState.end.logical + deltaLogical;
                        selectedDrawing.tp = initialObjState.tp + deltaPrice;
                        selectedDrawing.sl = initialObjState.sl + deltaPrice;
                    } else {
                        selectedDrawing.start.logical = initialObjState.start.logical + deltaLogical;
                        selectedDrawing.start.price = initialObjState.start.price + deltaPrice;
                        selectedDrawing.end.logical = initialObjState.end.logical + deltaLogical;
                        selectedDrawing.end.price = initialObjState.end.price + deltaPrice;
                    }
                } else {
                    if (dragHandle === 'tp') {
                        if (selectedDrawing.type === 'position-long' && coords.price > selectedDrawing.start.price) selectedDrawing.tp = coords.price;
                        if (selectedDrawing.type === 'position-short' && coords.price < selectedDrawing.start.price) selectedDrawing.tp = coords.price;
                    } else if (dragHandle === 'sl') {
                        if (selectedDrawing.type === 'position-long' && coords.price < selectedDrawing.start.price) selectedDrawing.sl = coords.price;
                        if (selectedDrawing.type === 'position-short' && coords.price > selectedDrawing.start.price) selectedDrawing.sl = coords.price;
                    } else if (dragHandle === 'exit') {
                        selectedDrawing.end.logical = coords.logical;
                    } else if (dragHandle === 'entry') {
                        selectedDrawing.start.logical = coords.logical;
                        selectedDrawing.start.price = coords.price;
                    } else {
                        selectedDrawing[dragHandle] = coords;
                    }
                }
            }
        }

        window.addEventListener('touchend', handleEnd);
        window.addEventListener('mouseup', handleEnd);

        function handleEnd() {
            if (isDrawing) {
                isDrawing = false;
                drawings.push(selectedDrawing); 
                setTool('pan'); 
            }
            
            if (dragHandle) {
                dragHandle = null;
                chart.applyOptions({ handleScroll: true, handleScale: true }); 
            }
            
            currentMouseX = null; currentMouseY = null;
        }

        // ==========================================
        // 7. TOMBOL TOOLBAR
        // ==========================================
        function setTool(tool, btnId = null) {
            currentTool = tool;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if (btnId) document.getElementById(btnId).classList.add('active');
            
            if (tool !== 'pan') {
                selectedDrawing = null; 
            }
        }

        document.getElementById('btn-line').onclick = () => setTool('line', 'btn-line');
        document.getElementById('btn-box').onclick = () => setTool('box', 'btn-box');
        document.getElementById('btn-long').onclick = () => setTool('position-long', 'btn-long');
        document.getElementById('btn-short').onclick = () => setTool('position-short', 'btn-short');
        
        document.getElementById('btn-clear').onclick = () => {
            drawings = [];
            selectedDrawing = null;
        };
    </script>
</body>
</html>
