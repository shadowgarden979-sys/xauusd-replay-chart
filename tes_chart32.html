<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tes Chart 30 - Multi TF Final Polish</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; font-family: sans-serif; overflow: hidden; }
        #chart-wrapper { position: relative; width: 100vw; height: 75vh; background-color: #1e1e1e; }
        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        #chart-container { position: relative; width: 100%; height: 100%; z-index: 2; }
        #fg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
        
        /* Date HUD - FIX: Posisi turun agar tidak menutupi dropdown */
        #date-hud {
            position: absolute; top: 65px; left: 10px; background: rgba(43, 43, 67, 0.8);
            color: #d1d4dc; padding: 5px 10px; border-radius: 4px; font-size: 12px;
            z-index: 10; pointer-events: none; border: 1px solid #485c7b;
        }

        /* Garis Gunting */
        #scissors-line {
            position: absolute; top: 0; bottom: 0; width: 2px; background-color: #2962FF; 
            z-index: 15; display: none; pointer-events: auto; cursor: ew-resize;
        }
        #scissors-icon {
            position: absolute; top: 50%; left: -15px; width: 30px; height: 30px;
            background-color: #2962FF; color: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 16px;
            transform: translateY(-50%); box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #scissors-time {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            background-color: #2962FF; color: white; padding: 4px 8px; border-radius: 4px;
            font-size: 11px; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* STICKY TOOLBAR */
        #toolbar { padding: 8px; display: flex; align-items: center; background: #2B2B43; z-index: 20; position: relative; gap: 8px; }
        
        .toolbar-fixed-left { position: relative; display: flex; align-items: center; }
        #btn-tf {
            background: #363A45; color: white; border: none; padding: 8px 12px; 
            border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        #tf-dropdown {
            position: absolute; top: 100%; left: 0; background: #2B2B43; border: 1px solid #485c7b;
            border-radius: 4px; margin-top: 5px; display: none; flex-direction: column; z-index: 30;
        }
        #tf-dropdown div {
            padding: 10px 20px; color: white; font-size: 12px; cursor: pointer; border-bottom: 1px solid #363A45;
        }
        #tf-dropdown div:active { background: #2962FF; }

        .toolbar-scroll { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; flex: 1; scrollbar-width: none; padding-bottom: 2px; }
        .toolbar-scroll::-webkit-scrollbar { display: none; }
        
        .btn { background: #363A45; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .btn.active { background: #2962FF; }
        .btn-long { background: #26a69a; }
        .btn-short { background: #ef5350; }

        .toolbar-fixed-right { display: flex; align-items: center; }
        .btn-danger { background: #ef5350; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }

        /* Panel Replay Bawah */
        #replay-panel {
            position: absolute; bottom: 0; left: 0; width: 100vw; height: 10vh;
            background: #2B2B43; z-index: 20; display: flex; align-items: center; justify-content: space-evenly;
            border-top: 1px solid #485c7b;
        }
        .r-btn { background: #363A45; color: white; border: none; padding: 10px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; }
        .r-btn:active { background: #2962FF; }
        select { background: #363A45; color: white; border: 1px solid #485c7b; padding: 8px; border-radius: 4px; font-size: 14px; }

        #floating-menu {
            position: absolute; display: none; background: #2B2B43; border: 1px solid #485c7b;
            border-radius: 6px; padding: 5px; gap: 5px; z-index: 20; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto; flex-direction: row; white-space: nowrap;
        }
        .f-btn { background: #363A45; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            z-index: 100; display: none; justify-content: center; align-items: center;
        }
        #modal-content {
            background: #2B2B43; padding: 20px; border-radius: 8px; width: 80%; max-width: 300px;
            color: white; display: flex; flex-direction: column; gap: 10px;
        }
        #modal-content label { font-size: 12px; color: #d1d4dc; }
        #modal-content input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; }
        #modal-content input[type="text"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #485c7b; background: #1e1e1e; color: white; }
        #modal-content input[type="number"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #485c7b; background: #1e1e1e; color: white; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    </style>
    
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <script src="data_M5_Jan2011.js"></script>
    <script src="data_M15_Jan2011.js"></script>
    <script src="data_H1_Jan2011.js"></script>
    <script src="data_H4_Jan2011.js"></script>
</head>
<body>

    <div id="toolbar">
        <div class="toolbar-fixed-left">
            <button id="btn-tf">M5 ▼</button>
            <div id="tf-dropdown">
                <div data-tf="M5">M5 (5 Menit)</div>
                <div data-tf="M15">M15 (15 Menit)</div>
                <div data-tf="H1">H1 (1 Jam)</div>
                <div data-tf="H4">H4 (4 Jam)</div>
            </div>
        </div>
        
        <div class="toolbar-scroll" id="toolbar-scroll">
            <button class="btn" id="btn-line">Garis</button>
            <button class="btn" id="btn-box">Kotak</button>
            <button class="btn" id="btn-fibo">Fibo</button>
            <button class="btn" id="btn-circle">Lingkaran</button>
            <button class="btn" id="btn-text">Teks</button>
            <button class="btn" id="btn-arrow">Panah</button>
            <button class="btn" id="btn-measure">Ukur</button>
            <button class="btn btn-long" id="btn-long">Long</button>
            <button class="btn btn-short" id="btn-short">Short</button>
        </div>

        <div class="toolbar-fixed-right">
            <button class="btn-danger" id="btn-clear">Hapus</button>
        </div>
    </div>

    <div id="chart-wrapper">
        <div id="date-hud">-</div>
        
        <div id="floating-menu">
            <button class="f-btn" id="f-btn-snap" style="display:none;">Snap</button>
            <button class="f-btn" id="f-btn-costum">Kostum</button>
            <button class="f-btn" id="f-btn-delete" style="background:#ef5350;">Hapus</button>
        </div>

        <canvas id="bg-canvas"></canvas>
        <div id="chart-container"></div>
        <canvas id="fg-canvas"></canvas>
        
        <div id="scissors-line">
            <div id="scissors-icon">✂</div>
            <div id="scissors-time">-</div>
        </div>
    </div>

    <div id="replay-panel">
        <button class="r-btn" id="btn-set-replay" style="background:#26a69a;">Set Replay</button>
        <button class="r-btn" id="btn-play">Play</button>
        <button class="r-btn" id="btn-pause">Pause</button>
        <button class="r-btn" id="btn-step">Step</button>
        <button class="r-btn" id="btn-toggle-line">Hide Line</button>
        <select id="speed-select">
            <option value="1000">1x</option>
            <option value="500">2x</option>
            <option value="200">5x</option>
        </select>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <h3 style="margin:0;">Kostumisasi</h3>
            
            <div id="color-input-container">
                <label>Warna:</label>
                <input type="color" id="input-color" value="#2962FF">
            </div>
            
            <div id="text-input-container" style="display:none;">
                <label>Teks:</label>
                <input type="text" id="input-text">
            </div>
            
            <div id="fibo-input-container" style="display:none;">
                <label>Level Fibo (pisahkan koma):</label>
                <input type="text" id="input-levels">
            </div>

            <div id="pos-input-container" style="display:none;">
                <label>Transparansi Dasar (0.01 - 0.9):</label>
                <input type="number" id="input-base-op" step="0.05" min="0.01" max="0.9" value="0.1">
                <label>Ketegasan Running (0.1 - 1.0):</label>
                <input type="number" id="input-active-op" step="0.05" min="0.1" max="1.0" value="0.4">
            </div>

            <div class="modal-btns">
                <button class="btn" id="btn-close-modal">Batal</button>
                <button class="btn" id="btn-save-modal" style="background:#26a69a;">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SETUP DATA & CHART
        // ==========================================
        const allRawData = {
            'M5': typeof data_M5_Jan2011 !== 'undefined' ? data_M5_Jan2011 : [],
            'M15': typeof data_M15_Jan2011 !== 'undefined' ? data_M15_Jan2011 : [],
            'H1': typeof data_H1_Jan2011 !== 'undefined' ? data_H1_Jan2011 : [],
            'H4': typeof data_H4_Jan2011 !== 'undefined' ? data_H4_Jan2011 : []
        };

        let allData = {};
        for (let tf in allRawData) {
            allData[tf] = allRawData[tf].map(item => ({
                time: Math.floor(item.timestamp / 1000), 
                open: item.open, high: item.high, low: item.low, close: item.close
            }));
        }

        let currentTF = 'M5';
        let fullData = allData[currentTF];

        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            width: container.clientWidth, height: container.clientHeight,
            layout: { background: { color: 'transparent' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#485c7b', rightOffset: 10, barSpacing: 8 },
            rightPriceScale: { autoScale: false, borderColor: '#485c7b' },
            handleScroll: { horzTouchDrag: true, vertTouchDrag: true },
            handleScale: { axisPressedMouseMove: { time: true, price: true }, pinch: true },
            crosshair: { mode: LightweightCharts.CrosshairMode.Hidden }
        });

        const series = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        let currentReplayIndex = Math.max(0, fullData.length - 100);
        series.setData(fullData.slice(0, currentReplayIndex));
        chart.timeScale().setVisibleLogicalRange({ from: currentReplayIndex - 50, to: currentReplayIndex + 10 });

        // ==========================================
        // 2. STATE & CANVAS SETUP
        // ==========================================
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const fgCanvas = document.getElementById('fg-canvas');
        const fgCtx = fgCanvas.getContext('2d');
        
        let drawings = [];
        try {
            const saved = JSON.parse(localStorage.getItem('xau_drawings_v30'));
            if (Array.isArray(saved)) drawings = saved;
        } catch(e) { console.log("LocalStorage reset."); }

        let defaultSettings = {
            line: { color: '#2962FF' }, box: { color: '#2962FF', text: '' },
            'position-long': { baseOpacity: 0.1, activeOpacity: 0.4 },
            'position-short': { baseOpacity: 0.1, activeOpacity: 0.4 },
            circle: { color: '#2962FF' }, text: { color: '#d1d4dc', text: 'Teks' },
            arrow: { color: '#2962FF' }, fibo: { color: '#d1d4dc', levels: [0, 0.236, 0.382, 0.5, 0.618, 1] }
        };
        try {
            const savedDefaults = JSON.parse(localStorage.getItem('xau_defaults_v30'));
            if (savedDefaults) defaultSettings = { ...defaultSettings, ...savedDefaults };
        } catch(e) { console.log("Defaults reset."); }

        let currentTool = 'pan';
        let isDrawing = false;
        let selectedDrawing = null; 
        let dragHandle = null; 
        let dragStartTime = null;
        let dragStartPrice = null;
        let initialObjState = null;
        let currentMouseX = null;
        let currentMouseY = null;
        let isMeasuring = false;
        let measureStart = null;
        let measureEnd = null;
        let measureFrozen = false;
        let snapEnabled = false;

        // State Replay
        let isReplayMode = false;
        let isPlaying = false;
        let playInterval = null;
        let replaySpeed = 1000;
        let isLineVisible = true;

        function resizeCanvas() {
            bgCanvas.width = fgCanvas.width = container.clientWidth;
            bgCanvas.height = fgCanvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==========================================
        // 3. FUNGSI GAMBAR & LOGIKA
        // ==========================================
        function getX(time) { 
            if (time === null || time === undefined) return null;
            return chart.timeScale().timeToCoordinate(time); 
        }
        function getY(price) { return series.priceToCoordinate(price); }

        function getTimeFromX(x) {
            const logical = chart.timeScale().coordinateToLogical(x);
            if (logical === null) return null;
            let idx = Math.round(logical);
            if (idx >= 0 && idx < fullData.length) return fullData[idx].time;
            return null;
        }

        function formatFullTime(timestamp) {
            let d = new Date(timestamp * 1000);
            let days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            let months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            let dayName = days[d.getUTCDay()];
            let dateStr = d.getUTCDate().toString().padStart(2, '0');
            let monthStr = months[d.getUTCMonth()];
            let yearStr = d.getUTCFullYear();
            let hh = d.getUTCHours().toString().padStart(2, '0');
            let mm = d.getUTCMinutes().toString().padStart(2, '0');
            return { dayName, dateStr, monthStr, yearStr, hh, mm };
        }

        function updateDateHUD() {
            let idx = isReplayMode ? Math.max(0, currentReplayIndex - 1) : fullData.length - 1;
            if (fullData[idx]) {
                let t = formatFullTime(fullData[idx].time);
                document.getElementById('date-hud').innerText = `${t.dayName}, ${t.dateStr} ${t.monthStr} ${t.yearStr} | ${t.hh}:${t.mm}`;
            }
        }

        function drawWarnings() {
            let limit = isReplayMode ? currentReplayIndex - 1 : fullData.length - 1;
            if (limit < 0) return;

            for (let i = 0; i <= limit; i++) {
                let c = fullData[i];
                let d = new Date(c.time * 1000);
                let day = d.getUTCDay(); 
                let hours = d.getUTCHours();
                let mins = d.getUTCMinutes();

                let x = getX(c.time);
                if (x === null) continue;

                if (day === 5 && hours === 21 && mins === 0) {
                    bgCtx.save();
                    bgCtx.strokeStyle = '#FFD700'; bgCtx.lineWidth = 1; bgCtx.setLineDash([5, 5]);
                    bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, bgCanvas.height); bgCtx.stroke();
                    bgCtx.fillStyle = '#FFD700'; bgCtx.font = 'bold 10px sans-serif'; bgCtx.textAlign = 'center';
                    bgCtx.fillText("⚠️ Closing Soon", x, 15);
                    bgCtx.restore();
                }

                if (day === 1 && hours === 0 && mins === 0) {
                    bgCtx.save();
                    bgCtx.strokeStyle = '#26a69a'; bgCtx.lineWidth = 1; bgCtx.setLineDash([5, 5]);
                    bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, bgCanvas.height); bgCtx.stroke();
                    bgCtx.fillStyle = '#26a69a'; bgCtx.font = 'bold 10px sans-serif'; bgCtx.textAlign = 'center';
                    bgCtx.fillText("🟢 Open Market", x, 15);
                    bgCtx.restore();
                }
            }
        }

        function drawMeasureTool() {
            const x1 = getX(measureStart.time); const y1 = getY(measureStart.price);
            const x2 = getX(measureEnd.time); const y2 = getY(measureEnd.price);
            if (x1 === null || y1 === null || x2 === null || y2 === null) return;

            fgCtx.save();
            fgCtx.strokeStyle = '#888888'; fgCtx.lineWidth = 1; fgCtx.setLineDash([3, 3]); 
            fgCtx.beginPath(); fgCtx.moveTo(x1, 0); fgCtx.lineTo(x1, fgCanvas.height); fgCtx.stroke();
            fgCtx.beginPath(); fgCtx.moveTo(0, y1); fgCtx.lineTo(fgCanvas.width, y1); fgCtx.stroke();
            fgCtx.beginPath(); fgCtx.moveTo(x2, 0); fgCtx.lineTo(x2, fgCanvas.height); fgCtx.stroke();
            fgCtx.beginPath(); fgCtx.moveTo(0, y2); fgCtx.lineTo(fgCanvas.width, y2); fgCtx.stroke();
            fgCtx.restore();

            fgCtx.fillStyle = 'rgba(41, 98, 255, 0.15)';
            fgCtx.strokeStyle = '#2962FF'; fgCtx.lineWidth = 1; fgCtx.setLineDash([]);
            fgCtx.beginPath(); fgCtx.rect(x1, y1, x2 - x1, y2 - y1); fgCtx.fill(); fgCtx.stroke();

            const pipDiff = Math.abs(measureEnd.price - measureStart.price) * 10;
            const timeDiffSeconds = Math.abs(measureEnd.time - measureStart.time);
            const timeDiffMinutes = timeDiffSeconds / 60; 
            const hours = Math.floor(timeDiffMinutes / 60);
            const mins = timeDiffMinutes % 60;
            const timeStr = (hours > 0 ? hours + 'h ' : '') + mins + 'm';

            const text = `${pipDiff.toFixed(1)} Pips | ${timeStr}`;
            
            fgCtx.font = '12px sans-serif';
            const textWidth = fgCtx.measureText(text).width;
            const boxX = (x1 + x2) / 2 - textWidth / 2 - 5;
            const boxY = (y1 + y2) / 2 - 10;

            fgCtx.fillStyle = '#2B2B43'; fgCtx.fillRect(boxX, boxY, textWidth + 10, 20);
            fgCtx.fillStyle = '#ffffff'; fgCtx.textAlign = 'center'; fgCtx.textBaseline = 'middle';
            fgCtx.fillText(text, boxX + (textWidth + 10) / 2, boxY + 10);
        }

        function calculateTradeLine(d) {
            let startTime = d.start.time;
            let endTime = d.end.time;
            
            let entryIndex = null;
            for (let i = 0; i < fullData.length; i++) {
                if (fullData[i].time >= startTime) { entryIndex = i; break; }
            }
            if (entryIndex === null) entryIndex = 0;

            let maxIdx = Math.min(fullData.length - 1, currentReplayIndex - 1);
            for (let i = 0; i < fullData.length; i++) {
                if (fullData[i].time > endTime) { maxIdx = Math.min(maxIdx, i - 1); break; }
            }
            if (maxIdx < 0) return null;

            let hitEntryIndex = null;
            for (let i = Math.max(0, entryIndex); i <= maxIdx; i++) {
                let c = fullData[i];
                if (c.low <= d.start.price && c.high >= d.start.price) { hitEntryIndex = i; break; }
            }
            
            // FIX: Jika belum ada candle yang menyentuh entry, jangan gambar running
            if (hitEntryIndex === null) return null; 

            let hitExitIndex = null, hitExitPrice = null;
            let isLong = d.type === 'position-long';

            for (let i = hitEntryIndex; i <= maxIdx; i++) {
                let c = fullData[i];
                if (isLong) {
                    if (c.high >= d.tp) { hitExitIndex = i; hitExitPrice = d.tp; break; }
                    if (c.low <= d.sl) { hitExitIndex = i; hitExitPrice = d.sl; break; }
                } else {
                    if (c.low <= d.tp) { hitExitIndex = i; hitExitPrice = d.tp; break; }
                    if (c.high >= d.sl) { hitExitIndex = i; hitExitPrice = d.sl; break; }
                }
            }

            if (hitExitIndex !== null) {
                return { startIdx: hitEntryIndex, endIdx: hitExitIndex, endPrice: hitExitPrice };
            } else {
                return { startIdx: hitEntryIndex, endIdx: maxIdx, endPrice: fullData[maxIdx].close };
            }
        }

        function drawPositionBg(d) {
            const x1 = getX(d.start.time); const x2 = getX(d.end.time);
            const yEntry = getY(d.start.price); const yTP = getY(d.tp); const ySL = getY(d.sl);
            if (x1 === null || x2 === null || yEntry === null || yTP === null || ySL === null) return;

            const isLong = d.type === 'position-long';
            const baseOp = d.baseOpacity !== undefined ? d.baseOpacity : 0.1;
            const activeOp = d.activeOpacity !== undefined ? d.activeOpacity : 0.4;

            bgCtx.fillStyle = `rgba(38, 166, 154, ${baseOp})`;
            bgCtx.beginPath(); bgCtx.rect(x1, yTP, x2 - x1, yEntry - yTP); bgCtx.fill();
            
            bgCtx.fillStyle = `rgba(239, 83, 80, ${baseOp})`;
            bgCtx.beginPath(); bgCtx.rect(x1, yEntry, x2 - x1, ySL - yEntry); bgCtx.fill();

            const tradeInfo = calculateTradeLine(d);
            
            if (tradeInfo) {
                const xStart = getX(fullData[tradeInfo.startIdx].time);
                const xExit = Math.min(getX(fullData[tradeInfo.endIdx].time), x2);
                let yExit = getY(tradeInfo.endPrice);
                
                if (xExit > x2) {
                    const ratio = (x2 - x1) / (xExit - x1);
                    yExit = yEntry + (yExit - yEntry) * ratio;
                }

                // FIX: Clamping Shading agar tidak tumpah ke luar TP/SL
                if (isLong) {
                    yExit = Math.max(yTP, Math.min(yEntry, yExit));
                } else {
                    yExit = Math.min(ySL, Math.max(yEntry, yExit));
                }

                if (isLong) {
                    if (yExit < yEntry - 1) {
                        bgCtx.fillStyle = `rgba(38, 166, 154, ${activeOp})`; 
                        bgCtx.beginPath(); bgCtx.rect(xStart, yExit, xExit - xStart, yEntry - yExit); bgCtx.fill();
                    } else if (yExit > yEntry + 1) {
                        bgCtx.fillStyle = `rgba(239, 83, 80, ${activeOp})`;
                        bgCtx.beginPath(); bgCtx.rect(xStart, yEntry, xExit - xStart, yExit - yEntry); bgCtx.fill();
                    }
                } else {
                    if (yExit > yEntry + 1) {
                        bgCtx.fillStyle = `rgba(38, 166, 154, ${activeOp})`; 
                        bgCtx.beginPath(); bgCtx.rect(xStart, yEntry, xExit - xStart, yExit - yEntry); bgCtx.fill();
                    } else if (yExit < yEntry - 1) {
                        bgCtx.fillStyle = `rgba(239, 83, 80, ${activeOp})`;
                        bgCtx.beginPath(); bgCtx.rect(xStart, yExit, xExit - xStart, yEntry - yExit); bgCtx.fill();
                    }
                }

                bgCtx.strokeStyle = '#ffffff'; bgCtx.lineWidth = 1; bgCtx.setLineDash([5, 5]);
                bgCtx.beginPath(); bgCtx.moveTo(xStart, yEntry); bgCtx.lineTo(xExit, yExit); bgCtx.stroke();
            }

            bgCtx.strokeStyle = '#ffffff'; bgCtx.lineWidth = 1; bgCtx.setLineDash([5, 5]);
            bgCtx.beginPath(); bgCtx.moveTo(x1, yEntry); bgCtx.lineTo(x2, yEntry); bgCtx.stroke();
            bgCtx.setLineDash([]);

            let risk = Math.abs(d.start.price - d.sl);
            let reward = Math.abs(d.tp - d.start.price);
            let rrText = risk > 0 ? (reward / risk).toFixed(2) : "0.00";
            
            fgCtx.font = 'bold 12px sans-serif';
            fgCtx.fillStyle = '#FFD700';
            let xEntry = getX(d.start.time);
            
            if (isLong) {
                fgCtx.textAlign = 'right'; fgCtx.textBaseline = 'middle';
                fgCtx.fillText(`R:R ${rrText}`, xEntry - 15, yEntry);
            } else {
                fgCtx.textAlign = 'left'; fgCtx.textBaseline = 'middle';
                fgCtx.fillText(`R:R ${rrText}`, xEntry + 15, yEntry);
            }
        }

        function drawShapeFg(d, isSelected) {
            const x1 = getX(d.start.time); const y1 = getY(d.start.price);
            const x2 = getX(d.end.time); const y2 = getY(d.end.price);
            if (x1 === null || y1 === null || x2 === null || y2 === null) return;

            fgCtx.lineWidth = isSelected ? 3 : 2;
            fgCtx.strokeStyle = isSelected ? '#FFD700' : (d.color || '#2962FF'); 
            fgCtx.setLineDash([]);

            if (d.type === 'line') {
                fgCtx.beginPath(); fgCtx.moveTo(x1, y1); fgCtx.lineTo(x2, y2); fgCtx.stroke();
            } else if (d.type === 'box') {
                fgCtx.beginPath(); fgCtx.rect(x1, y1, x2 - x1, y2 - y1); fgCtx.stroke();
                fgCtx.fillStyle = d.color ? d.color + '20' : 'rgba(41, 98, 255, 0.1)'; fgCtx.fill();
                if (d.text) {
                    fgCtx.font = '12px sans-serif'; fgCtx.fillStyle = '#ffffff'; fgCtx.textAlign = 'center';
                    fgCtx.fillText(d.text, (x1 + x2) / 2, (y1 + y2) / 2);
                }
            } else if (d.type === 'circle') {
                const radius = Math.hypot(x2 - x1, y2 - y1);
                fgCtx.beginPath(); fgCtx.arc(x1, y1, radius, 0, 2 * Math.PI); fgCtx.stroke();
                fgCtx.fillStyle = d.color ? d.color + '20' : 'rgba(41, 98, 255, 0.1)'; fgCtx.fill();
            } else if (d.type === 'arrow') {
                fgCtx.beginPath(); fgCtx.moveTo(x1, y1); fgCtx.lineTo(x2, y2); fgCtx.stroke();
                const angle = Math.atan2(y2 - y1, x2 - x1); const headLen = 15;
                fgCtx.beginPath(); fgCtx.moveTo(x2, y2);
                fgCtx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
                fgCtx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
                fgCtx.closePath(); fgCtx.fillStyle = isSelected ? '#FFD700' : (d.color || '#2962FF'); fgCtx.fill();
            } else if (d.type === 'text') {
                fgCtx.font = '14px sans-serif'; fgCtx.fillStyle = isSelected ? '#FFD700' : (d.color || '#d1d4dc');
                fgCtx.fillText(d.text || "Teks", x1, y1);
            } else if (d.type === 'fibo') {
                const levels = d.levels || [0, 0.236, 0.382, 0.5, 0.618, 1];
                fgCtx.font = '10px sans-serif'; fgCtx.fillStyle = isSelected ? '#FFD700' : (d.color || '#d1d4dc');
                levels.forEach(lvl => {
                    const yLvl = y1 + (y2 - y1) * lvl;
                    fgCtx.beginPath(); fgCtx.moveTo(x1, yLvl); fgCtx.lineTo(x2, yLvl); fgCtx.stroke();
                    // FIX: Teks Fibo digeser ke kanan
                    fgCtx.fillText(lvl.toFixed(3), x2 + 35, yLvl + 3);
                });
            }
        }

        function drawHandlesFg(d) {
            fgCtx.fillStyle = '#FFD700';
            if (d.type.startsWith('position')) {
                let x1 = getX(d.start.time); let yEntry = getY(d.start.price);
                let x2 = getX(d.end.time); let yTP = getY(d.tp); let ySL = getY(d.sl);
                fgCtx.beginPath(); fgCtx.arc(x1, yEntry, 6, 0, Math.PI * 2); fgCtx.fill();
                fgCtx.beginPath(); fgCtx.arc(x2, yTP, 6, 0, Math.PI * 2); fgCtx.fill();
                fgCtx.beginPath(); fgCtx.arc(x2, ySL, 6, 0, Math.PI * 2); fgCtx.fill();
                fgCtx.beginPath(); fgCtx.arc(x2, yEntry, 6, 0, Math.PI * 2); fgCtx.fill();
                let cx = (x1 + x2) / 2; let cy = (yEntry + yTP + ySL) / 3;
                fgCtx.fillRect(cx - 5, cy - 5, 10, 10);
            } else if (d.type === 'circle') {
                const x1 = getX(d.start.time); const y1 = getY(d.start.price);
                const x2 = getX(d.end.time); const y2 = getY(d.end.price);
                fgCtx.fillRect(x1 - 5, y1 - 5, 10, 10);
                fgCtx.beginPath(); fgCtx.arc(x2, y2, 6, 0, Math.PI * 2); fgCtx.fill();
            } else {
                const x1 = getX(d.start.time); const y1 = getY(d.start.price);
                const x2 = getX(d.end.time); const y2 = getY(d.end.price);
                fgCtx.beginPath(); fgCtx.arc(x1, y1, 6, 0, Math.PI * 2); fgCtx.fill(); 
                fgCtx.beginPath(); fgCtx.arc(x2, y2, 6, 0, Math.PI * 2); fgCtx.fill(); 
                let cx = (x1 + x2) / 2; let cy = (y1 + y2) / 2;
                fgCtx.fillRect(cx - 5, cy - 5, 10, 10);
            }
        }

        function drawLabelsFg(d) {
            if (d.type.startsWith('position')) {
                fgCtx.font = '11px sans-serif'; fgCtx.fillStyle = '#ffffff'; fgCtx.textAlign = 'left'; fgCtx.textBaseline = 'middle';
                let x2 = getX(d.end.time); let yTP = getY(d.tp); let ySL = getY(d.sl); let yEntry = getY(d.start.price);
                if (yTP !== null) fgCtx.fillText(d.tp.toFixed(2), x2 + 12, yTP);
                if (ySL !== null) fgCtx.fillText(d.sl.toFixed(2), x2 + 12, ySL);
                if (yEntry !== null) fgCtx.fillText(d.start.price.toFixed(2), x2 + 12, yEntry);
            }
        }

        function drawCrosshair() {
            fgCtx.save();
            fgCtx.strokeStyle = '#888888'; fgCtx.lineWidth = 1; fgCtx.setLineDash([5, 5]); 
            fgCtx.beginPath(); fgCtx.moveTo(currentMouseX, 0); fgCtx.lineTo(currentMouseX, fgCanvas.height); fgCtx.stroke();
            fgCtx.beginPath(); fgCtx.moveTo(0, currentMouseY); fgCtx.lineTo(fgCanvas.width, currentMouseY); fgCtx.stroke();
            fgCtx.restore();

            let price = series.coordinateToPrice(currentMouseY);
            let time = chart.timeScale().coordinateToTime(currentMouseX);
            
            if (price !== null && time !== null) {
                fgCtx.fillStyle = '#363A45'; fgCtx.fillRect(fgCanvas.width - 65, currentMouseY - 10, 65, 20);
                fgCtx.fillStyle = '#d1d4dc'; fgCtx.font = '12px sans-serif'; fgCtx.textAlign = 'center';
                fgCtx.fillText(price.toFixed(2), fgCanvas.width - 32, currentMouseY + 4);

                let t = formatFullTime(time);
                let timeStr = `${t.hh}:${t.mm} | ${t.dayName} | ${t.dateStr} ${t.monthStr} ${t.yearStr}`;
                
                fgCtx.font = '11px sans-serif';
                let timeWidth = fgCtx.measureText(timeStr).width + 10;
                
                fgCtx.fillStyle = '#363A45'; 
                fgCtx.fillRect(currentMouseX - timeWidth/2, fgCanvas.height - 25, timeWidth, 20);
                fgCtx.fillStyle = '#d1d4dc'; 
                fgCtx.fillText(timeStr, currentMouseX, fgCanvas.height - 10);
            }
        }

        function saveToLocalStorage() { 
            localStorage.setItem('xau_drawings_v30', JSON.stringify(drawings)); 
        }
        function saveDefaults() {
            localStorage.setItem('xau_defaults_v30', JSON.stringify(defaultSettings));
        }

        // ==========================================
        // 4. RENDER LOOP
        // ==========================================
        function render() {
            try {
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                fgCtx.clearRect(0, 0, fgCanvas.width, fgCanvas.height);
                
                drawWarnings(); 
                
                drawings.forEach(d => {
                    if (d.type.startsWith('position')) drawPositionBg(d);
                    else drawShapeFg(d, d === selectedDrawing);
                    
                    if (d === selectedDrawing) {
                        drawHandlesFg(d);
                        drawLabelsFg(d); // FIX: Kembalikan label harga
                    }
                });

                if (isDrawing && selectedDrawing) {
                    if (selectedDrawing.type.startsWith('position')) drawPositionBg(selectedDrawing);
                    else drawShapeFg(selectedDrawing, true);
                    drawHandlesFg(selectedDrawing);
                    drawLabelsFg(selectedDrawing);
                }

                if (measureStart && measureEnd) {
                    drawMeasureTool();
                }

                if (currentMouseX !== null && currentMouseY !== null && !measureFrozen) {
                    drawCrosshair();
                }

                updateFloatingMenuPosition();
                updateScissorsPosition();
                updateDateHUD();
            } catch (error) {
                console.error("Render Error:", error);
            }
            requestAnimationFrame(render);
        }

        // ==========================================
        // 5. LOGIKA TF, REPLAY & SCISSORS
        // ==========================================

        const scissorsLine = document.getElementById('scissors-line');
        const scissorsTime = document.getElementById('scissors-time');
        const btnSetReplay = document.getElementById('btn-set-replay');
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');

        const btnToggleLine = document.getElementById('btn-toggle-line');

            tfDropdown.style.display = tfDropdown.style.display === 'flex' ? 'none' : 'flex';
        };

                if (newTF && allData[newTF].length > 0) {
                    currentTF = newTF;
                    fullData = allData[currentTF];
                    btnTF.innerText = currentTF + ' ▼';
                    
                    if (isReplayMode) {
                        currentReplayIndex = Math.max(20, fullData.length - 100);

                    chart.timeScale().fitContent();
                }
                tfDropdown.style.display = 'none';
            };
        });

        document.addEventListener('click', () => { tfDropdown.style.display = 'none'; });

        function updateScissorsPosition() {
            if (!isReplayMode || !isLineVisible || isPlaying) return;
            let idx = Math.max(0, currentReplayIndex - 1);
            if (fullData[idx]) {
                const x = getX(fullData[idx].time);
                if (x !== null) {
                    scissorsLine.style.left = x + 'px';
                    let t = fullData[idx].time;
                    let date = new Date(t * 1000);
                    let str = `${date.getUTCFullYear()}-${(date.getUTCMonth()+1).toString().padStart(2,'0')}-${date.getUTCDate().toString().padStart(2,'0')} ${date.getUTCHours().toString().padStart(2,'0')}:${date.getUTCMinutes().toString().padStart(2,'0')}`;
                    scissorsTime.innerText = str;
                }
            }
        }

        function updateScissorsVisibility() {
            if (!isReplayMode || isPlaying || !isLineVisible) {
                scissorsLine.style.display = 'none';
            } else {
                scissorsLine.style.display = 'block';
            }
        }

        let isDraggingScissors = false;

        scissorsLine.addEventListener('touchstart', (e) => {
            isDraggingScissors = true;
            e.preventDefault(); e.stopPropagation();
            chart.applyOptions({ handleScroll: false, handleScale: false }); 
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!isDraggingScissors) return;
            e.preventDefault(); e.stopPropagation();
            
            const rect = container.getBoundingClientRect();
            const clientX = e.touches[0].clientX;
            const x = clientX - rect.left;
            
            let newIdx = Math.round(chart.timeScale().coordinateToLogical(x));
            if (newIdx === null) return;
            
            newIdx = Math.max(20, Math.min(newIdx, fullData.length - 1));
            
            if (newIdx !== currentReplayIndex) {
                currentReplayIndex = newIdx;
                series.setData(fullData.slice(0, currentReplayIndex));
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            if (isDraggingScissors) {
                isDraggingScissors = false;
                chart.applyOptions({ handleScroll: true, handleScale: true }); 
            }
        });

        btnSetReplay.onclick = () => {
            isReplayMode = !isReplayMode;
            if (isReplayMode) {
                btnSetReplay.style.background = '#ef5350';
                isLineVisible = true;
                btnToggleLine.innerText = "Hide Line";
                currentReplayIndex = Math.max(20, fullData.length - 100); 
                series.setData(fullData.slice(0, currentReplayIndex));
                chart.timeScale().scrollToPosition(5, false);
            } else {
                btnSetReplay.style.background = '#26a69a';
                pauseReplay();
                currentReplayIndex = fullData.length;
                series.setData(fullData);
            }
            updateScissorsVisibility();
        };

        btnPlay.onclick = () => {
            if (!isReplayMode) { alert("Aktifkan Set Replay dulu!"); return; }
            if (isPlaying) return;
            isPlaying = true;
            updateScissorsVisibility(); 
            
            playInterval = setInterval(() => {
                if (currentReplayIndex < fullData.length) {
                    currentReplayIndex++;
                    series.update(fullData[currentReplayIndex - 1]); 
                    if (currentReplayIndex >= fullData.length) pauseReplay();
                } else {
                    pauseReplay();
                }
            }, replaySpeed);
        };

        btnPause.onclick = pauseReplay;
        function pauseReplay() {
            isPlaying = false;
            clearInterval(playInterval);
            updateScissorsVisibility();
        }

        btnStep.onclick = () => {
            if (!isReplayMode) { alert("Aktifkan Set Replay dulu!"); return; }
            if (currentReplayIndex < fullData.length) {
                currentReplayIndex++;
                series.update(fullData[currentReplayIndex - 1]);
            }
        };

        btnToggleLine.onclick = () => {
            isLineVisible = !isLineVisible;
            btnToggleLine.innerText = isLineVisible ? "Hide Line" : "Show Line";
            updateScissorsVisibility();
        };

        speedSelect.onchange = (e) => { replaySpeed = parseInt(e.target.value); };

        chart.timeScale().subscribeVisibleLogicalRangeChange(() => { updateScissorsPosition(); });

        // ==========================================
        // 6. EVENT LISTENERS & LOGIKA DRAG (DRAWING)
        // ==========================================
        function getCoords(e) {
            const rect = container.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function getChartCoords(x, y) {
            const time = getTimeFromX(x);
            const price = series.coordinateToPrice(y);
            if (time === null || price === null) return null;
            return { time, price };
        }

        function checkHandleHit(x, y) {
            if (!selectedDrawing) return null;
            const d = selectedDrawing;
            if (d.type === 'circle') {
                const cx = getX(d.start.time); const cy = getY(d.start.price);
                const ex = getX(d.end.time); const ey = getY(d.end.price);
                if (Math.hypot(x - cx, y - cy) < 30) return 'center';
                if (Math.hypot(x - ex, y - ey) < 30) return 'end';
                return null;
            }
            let cx, cy;
            if (d.type.startsWith('position')) {
                let x1 = getX(d.start.time); let yEntry = getY(d.start.price);
                let x2 = getX(d.end.time); let yTP = getY(d.tp); let ySL = getY(d.sl);
                cx = (x1 + x2) / 2; cy = (yEntry + yTP + ySL) / 3;
            } else {
                const x1 = getX(d.start.time); const y1 = getY(d.start.price);
                const x2 = getX(d.end.time); const y2 = getY(d.end.price);
                cx = (x1 + x2) / 2; cy = (y1 + y2) / 2;
            }
            if (Math.hypot(x - cx, y - cy) < 30) return 'center';

            if (d.type.startsWith('position')) {
                const x1 = getX(d.start.time); const yEntry = getY(d.start.price);
                const x2 = getX(d.end.time); const yTP = getY(d.tp); const ySL = getY(d.sl);
                if (Math.hypot(x - x1, y - yEntry) < 30) return 'entry';
                if (Math.hypot(x - x2, y - yTP) < 30) return 'tp';
                if (Math.hypot(x - x2, y - ySL) < 30) return 'sl';
                if (Math.hypot(x - x2, y - yEntry) < 30) return 'exit';
            } else {
                const x1 = getX(d.start.time); const y1 = getY(d.start.price);
                const x2 = getX(d.end.time); const y2 = getY(d.end.price);
                if (Math.hypot(x - x1, y - y1) < 30) return 'start';
                if (Math.hypot(x - x2, y - y2) < 30) return 'end';
            }
            return null;
        }

        function checkObjectHit(x, y) {
            for (let i = drawings.length - 1; i >= 0; i--) {
                const d = drawings[i];
                if (!d || !d.type) continue;
                const x1 = getX(d.start.time); const y1 = getY(d.start.price);
                if (d.type.startsWith('position')) {
                    let x2 = getX(d.end.time); const yTP = getY(d.tp); const ySL = getY(d.sl);
                    const minX = Math.min(x1, x2); const maxX = Math.max(x1, x2);
                    const minY = Math.min(yTP, ySL, y1); const maxY = Math.max(yTP, ySL, y1);
                    if (x > minX && x < maxX && y > minY && y < maxY) return d;
                } else if (d.type === 'circle') {
                    const x2 = getX(d.end.time); const y2 = getY(d.end.price);
                    if (x1 === null || y1 === null || x2 === null || y2 === null) continue;
                    if (Math.hypot(x - x1, y - y1) <= Math.hypot(x2 - x1, y2 - y1) + 10) return d;
                } else {
                    const x2 = getX(d.end.time); const y2 = getY(d.end.price);
                    if (x1 === null || y1 === null || x2 === null || y2 === null) continue;
                    if (d.type === 'box') {
                        const minX = Math.min(x1, x2); const maxX = Math.max(x1, x2);
                        const minY = Math.min(y1, y2); const maxY = Math.max(y1, y2);
                        if (x > minX && x < maxX && y > minY && y < maxY) return d;
                    } else if (d.type === 'line' || d.type === 'arrow' || d.type === 'fibo') {
                        if (Math.abs((y2 - y1)*x - (x2 - x1)*y + x2*y1 - y2*x1) / Math.hypot(y2-y1, x2-x1) < 20) return d;
                    } else if (d.type === 'text') {
                        if (Math.hypot(x - x1, y - y1) < 30) return d;
                    }
                }
            }
            return null;
        }

        const floatingMenu = document.getElementById('floating-menu');
        const btnSnap = document.getElementById('f-btn-snap');
        const btnCostum = document.getElementById('f-btn-costum');
        const btnDelete = document.getElementById('f-btn-delete');
        const modalOverlay = document.getElementById('modal-overlay');
        const colorInputContainer = document.getElementById('color-input-container');
        const inputColor = document.getElementById('input-color');
        const textInputContainer = document.getElementById('text-input-container');
        const inputText = document.getElementById('input-text');
        const fiboInputContainer = document.getElementById('fibo-input-container');
        const inputLevels = document.getElementById('input-levels');
        const posInputContainer = document.getElementById('pos-input-container');
        const inputBaseOp = document.getElementById('input-base-op');
        const inputActiveOp = document.getElementById('input-active-op');

        function updateFloatingMenuPosition() {
            if (!selectedDrawing) {
                floatingMenu.style.display = 'none';
                return;
            }
            let maxY = -Infinity, minX = Infinity, maxX = -Infinity, minY = Infinity;
            if (selectedDrawing.type.startsWith('position')) {
                minX = getX(selectedDrawing.start.time); maxX = getX(selectedDrawing.end.time);
                let yTP = getY(selectedDrawing.tp); let ySL = getY(selectedDrawing.sl); let yEntry = getY(selectedDrawing.start.price);
                maxY = Math.max(yTP, ySL, yEntry); minY = Math.min(yTP, ySL, yEntry);
            } else if (selectedDrawing.type === 'circle') {
                let cx = getX(selectedDrawing.start.time); let cy = getY(selectedDrawing.start.price);
                let ex = getX(selectedDrawing.end.time); let ey = getY(selectedDrawing.end.price);
                let rad = Math.hypot(ex - cx, ey - cy);
                minX = cx - rad; maxX = cx + rad; maxY = cy + rad; minY = cy - rad;
            } else {
                minX = Math.min(getX(selectedDrawing.start.time), getX(selectedDrawing.end.time));
                maxX = Math.max(getX(selectedDrawing.start.time), getX(selectedDrawing.end.time));
                minY = Math.min(getY(selectedDrawing.start.price), getY(selectedDrawing.end.price));
                maxY = Math.max(getY(selectedDrawing.start.price), getY(selectedDrawing.end.price));
            }

            let centerX = (minX + maxX) / 2;
            let menuX = centerX - (floatingMenu.offsetWidth / 2); 
            let menuY = minY - 50; 

            menuX = Math.max(10, Math.min(menuX, fgCanvas.width - floatingMenu.offsetWidth - 10));
            if (menuY < 10) menuY = maxY + 10; 

            floatingMenu.style.display = 'flex';
            floatingMenu.style.left = menuX + 'px';
            floatingMenu.style.top = menuY + 'px';

            if (selectedDrawing.type === 'line') {
                btnSnap.style.display = 'block';
                btnSnap.className = 'f-btn' + (snapEnabled ? ' snap-active' : '');
            } else {
                btnSnap.style.display = 'none';
            }
        }

        btnDelete.onclick = () => {
            if (selectedDrawing) {
                drawings = drawings.filter(d => d !== selectedDrawing);
                selectedDrawing = null; saveToLocalStorage();
            }
        };
        btnSnap.onclick = () => { snapEnabled = !snapEnabled; };

        btnCostum.onclick = () => {
            if (!selectedDrawing) return;
            
            colorInputContainer.style.display = 'block';
            textInputContainer.style.display = 'none';
            fiboInputContainer.style.display = 'none';
            posInputContainer.style.display = 'none';

                textInputContainer.style.display = 'block'; inputText.value = selectedDrawing.text || '';
            } else if (selectedDrawing.type === 'fibo') {
                fiboInputContainer.style.display = 'block';
                inputLevels.value = (selectedDrawing.levels || defaultSettings.fibo.levels).join(', ');
            } else if (selectedDrawing.type.startsWith('position')) {
                colorInputContainer.style.display = 'none';

                inputBaseOp.value = selectedDrawing.baseOpacity !== undefined ? selectedDrawing.baseOpacity : defaultSettings[selectedDrawing.type].baseOpacity;
                inputActiveOp.value = selectedDrawing.activeOpacity !== undefined ? selectedDrawing.activeOpacity : defaultSettings[selectedDrawing.type].activeOpacity;
            } else {
                inputColor.value = selectedDrawing.color || defaultSettings[selectedDrawing.type]?.color || '#2962FF';

            modalOverlay.style.display = 'flex';
        };

        document.getElementById('btn-close-modal').onclick = () => { modalOverlay.style.display = 'none'; };
        
        document.getElementById('btn-save-modal').onclick = () => {
            if (selectedDrawing) {
                let saveProps = {};
                
                if (selectedDrawing.type === 'box') {
                    selectedDrawing.text = inputText.value;
                    saveProps.text = inputText.value;
                }
                if (selectedDrawing.type === 'fibo') {
                    selectedDrawing.levels = inputLevels.value.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
                    saveProps.levels = selectedDrawing.levels;
                }
                if (selectedDrawing.type.startsWith('position')) {
                    selectedDrawing.baseOpacity = parseFloat(inputBaseOp.value);
                    selectedDrawing.activeOpacity = parseFloat(inputActiveOp.value);
                    saveProps.baseOpacity = selectedDrawing.baseOpacity;
                    saveProps.activeOpacity = selectedDrawing.activeOpacity;
                } else if (!selectedDrawing.type.startsWith('position') && selectedDrawing.type !== 'box' && selectedDrawing.type !== 'fibo') {
                    selectedDrawing.color = inputColor.value;
                    saveProps.color = selectedDrawing.color;
                }

                defaultSettings[selectedDrawing.type] = { ...defaultSettings[selectedDrawing.type], ...saveProps };
                saveDefaults();
                saveToLocalStorage();
            }
            modalOverlay.style.display = 'none';
        };

        container.addEventListener('touchstart', handleStart, { passive: false });
        container.addEventListener('mousedown', handleStart);

        function handleStart(e) {
            const { x, y } = getCoords(e);
            currentMouseX = x; currentMouseY = y;

            if (currentTool === 'measure') {
                e.preventDefault();
                const coords = getChartCoords(x, y);
                if (coords) {
                    if (measureFrozen) {
                        measureFrozen = false; measureStart = null; measureEnd = null; setTool('pan');
                    } else {
                        isMeasuring = true; measureStart = coords; measureEnd = coords;
                    }
                }
                return;
            }

            if (currentTool !== 'pan') {
                e.preventDefault(); 
                if (isPlaying) pauseReplay();

                const coords = getChartCoords(x, y);
                if (coords) {
                    const def = defaultSettings[currentTool] || {};

                    if (currentTool === 'position-long' || currentTool === 'position-short') {
                        let isLong = currentTool === 'position-long';
                        let tp = isLong ? coords.price + 5 : coords.price - 5;
                        let sl = isLong ? coords.price - 5 : coords.price + 5;
                        
                        let endIdx = Math.min(fullData.length - 1, chart.timeScale().coordinateToLogical(x) + 20);
                        let endTime = fullData[endIdx] ? fullData[endIdx].time : coords.time + 3600;

                        let newPos = { 
                            type: currentTool, start: coords, end: { time: endTime, price: coords.price }, tp, sl,
                            baseOpacity: def.baseOpacity !== undefined ? def.baseOpacity : 0.1,
                            activeOpacity: def.activeOpacity !== undefined ? def.activeOpacity : 0.4
                        };
                        drawings.push(newPos); selectedDrawing = newPos;
                        setTool('pan'); saveToLocalStorage();
                    } else if (currentTool === 'circle') {
                        let endIdx = Math.min(fullData.length - 1, chart.timeScale().coordinateToLogical(x) + 10);
                        let endTime = fullData[endIdx] ? fullData[endIdx].time : coords.time + 1800;

                        let newCircle = { 
                            type: 'circle', start: coords, end: { time: endTime, price: coords.price + 5 },
                            color: def.color || '#2962FF'
                        };
                        drawings.push(newCircle); selectedDrawing = newCircle;
                        setTool('pan'); saveToLocalStorage();
                    } else if (currentTool === 'text') {
                        let text = prompt("Masukkan teks:", def.text || "Teks");
                        if (text) {
                            let newText = { type: 'text', start: coords, end: coords, text: text, color: def.color || '#d1d4dc' };
                            drawings.push(newText); saveToLocalStorage();
                        }
                        setTool('pan');
                    } else {
                        isDrawing = true;
                        selectedDrawing = { 
                            type: currentTool, start: coords, end: coords,
                            color: def.color || '#2962FF',
                            levels: def.levels || [0, 0.236, 0.382, 0.5, 0.618, 1]
                        };
                    }
                }
                return;
            }

            if (measureFrozen) {
                measureFrozen = false; measureStart = null; measureEnd = null; return;
            }

            const hitHandle = checkHandleHit(x, y);
            if (hitHandle) {
                dragHandle = hitHandle; e.preventDefault(); 
                chart.applyOptions({ handleScroll: false, handleScale: false }); 
                const coords = getChartCoords(x, y);
                dragStartTime = coords.time; dragStartPrice = coords.price;
                initialObjState = JSON.parse(JSON.stringify(selectedDrawing));
                return;
            }

            const hitObj = checkObjectHit(x, y);
            if (hitObj) {
                if (hitObj.type === 'text') {
                    let newText = prompt("Edit teks:", hitObj.text);
                    if (newText !== null) { hitObj.text = newText; saveToLocalStorage(); }
                }
                selectedDrawing = hitObj; e.preventDefault(); return;
            }
            selectedDrawing = null; 
        }

        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('mousemove', handleMove);

        function handleMove(e) {
            const { x, y } = getCoords(e);
            currentMouseX = x; currentMouseY = y;

            if (isMeasuring) {
                e.preventDefault();
                const coords = getChartCoords(x, y);
                if (coords) measureEnd = coords;
            } else if (isDrawing && selectedDrawing) {
                e.preventDefault();
                const coords = getChartCoords(x, y);
                if (coords) selectedDrawing.end = coords;
            } else if (dragHandle && selectedDrawing) {
                e.preventDefault();
                const coords = getChartCoords(x, y);
                if (!coords) return;

                if (dragHandle === 'center') {
                    const deltaTime = coords.time - dragStartTime;
                    const deltaPrice = coords.price - dragStartPrice;
                    if (selectedDrawing.type.startsWith('position')) {
                        selectedDrawing.start.time = initialObjState.start.time + deltaTime;
                        selectedDrawing.start.price = initialObjState.start.price + deltaPrice;
                        selectedDrawing.end.time = initialObjState.end.time + deltaTime;
                        selectedDrawing.tp = initialObjState.tp + deltaPrice;
                        selectedDrawing.sl = initialObjState.sl + deltaPrice;
                    } else {
                        selectedDrawing.start.time = initialObjState.start.time + deltaTime;
                        selectedDrawing.start.price = initialObjState.start.price + deltaPrice;
                        selectedDrawing.end.time = initialObjState.end.time + deltaTime;
                        selectedDrawing.end.price = initialObjState.end.price + deltaPrice;
                    }
                } else {
                    if (dragHandle === 'tp') {
                        if (selectedDrawing.type === 'position-long' && coords.price > selectedDrawing.start.price) selectedDrawing.tp = coords.price;
                        if (selectedDrawing.type === 'position-short' && coords.price < selectedDrawing.start.price) selectedDrawing.tp = coords.price;
                    } else if (dragHandle === 'sl') {
                        if (selectedDrawing.type === 'position-long' && coords.price < selectedDrawing.start.price) selectedDrawing.sl = coords.price;
                        if (selectedDrawing.type === 'position-short' && coords.price > selectedDrawing.start.price) selectedDrawing.sl = coords.price;
                    } else if (dragHandle === 'exit') {
                        selectedDrawing.end.time = coords.time;
                    } else if (dragHandle === 'entry') {
                        let newPrice = coords.price;
                        if (selectedDrawing.type === 'position-long') {
                            if (newPrice >= selectedDrawing.tp) newPrice = selectedDrawing.tp - 0.01;
                            if (newPrice <= selectedDrawing.sl) newPrice = selectedDrawing.sl + 0.01;
                        } else {
                            if (newPrice <= selectedDrawing.tp) newPrice = selectedDrawing.tp + 0.01;
                            if (newPrice >= selectedDrawing.sl) newPrice = selectedDrawing.sl - 0.01;
                        }
                        selectedDrawing.start.time = coords.time;
                        selectedDrawing.start.price = newPrice;
                        selectedDrawing.end.price = newPrice;
                    } else {
                        if (selectedDrawing.type === 'line' && snapEnabled) {
                            const startX = getX(selectedDrawing.start.time); const startY = getY(selectedDrawing.start.price);
                            if (Math.abs(x - startX) < 15) coords.time = selectedDrawing.start.time; 
                            if (Math.abs(y - startY) < 15) coords.price = selectedDrawing.start.price; 
                        }
                        selectedDrawing[dragHandle] = coords;
                    }
                }
            }
        }

        window.addEventListener('touchend', handleEnd);
        window.addEventListener('mouseup', handleEnd);

        function handleEnd() {
            if (isMeasuring) { isMeasuring = false; measureFrozen = true; }
            if (isDrawing) {
                isDrawing = false;
                drawings.push(selectedDrawing); setTool('pan'); saveToLocalStorage(); 
            }
            if (dragHandle) {
                dragHandle = null;
                chart.applyOptions({ handleScroll: true, handleScale: true }); 
                saveToLocalStorage(); 
            }
            currentMouseX = null; currentMouseY = null;
        }

        function setTool(tool, btnId = null) {
            currentTool = tool;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if (btnId) document.getElementById(btnId).classList.add('active');
            if (tool !== 'pan') selectedDrawing = null; 
        }

        document.getElementById('btn-line').onclick = () => setTool('line', 'btn-line');
        document.getElementById('btn-box').onclick = () => setTool('box', 'btn-box');
        document.getElementById('btn-fibo').onclick = () => setTool('fibo', 'btn-fibo');
        document.getElementById('btn-circle').onclick = () => setTool('circle', 'btn-circle');
        document.getElementById('btn-text').onclick = () => setTool('text', 'btn-text');
        document.getElementById('btn-arrow').onclick = () => setTool('arrow', 'btn-arrow');
        document.getElementById('btn-measure').onclick = () => setTool('measure', 'btn-measure');
        document.getElementById('btn-long').onclick = () => setTool('position-long', 'btn-long');
        document.getElementById('btn-short').onclick = () => setTool('position-short', 'btn-short');
        
        document.getElementById('btn-clear').onclick = () => {
            if(confirm("Hapus semua objek?")) {
                drawings = []; selectedDrawing = null; saveToLocalStorage();
            }
        };

        render();
    </script>
</body>
</html>
