<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tes Lightweight Charts</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; font-family: sans-serif; overflow: hidden; }
        #chart-container { width: 100vw; height: 80vh; touch-action: pan-x pan-y; }
        #toolbar { padding: 10px; display: flex; gap: 5px; background: #2B2B43; z-index: 10; position: relative; }
        .btn { background: #363A45; color: white; border: none; padding: 8px; border-radius: 4px; font-size: 12px; }
        .btn.active { background: #2962FF; }
    </style>
    
    <!-- 1. Library Utama Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    
    <!-- 2. Plugin Alat Gambar (Drawing Tools) -->
    <script src="https://unpkg.com/lightweight-charts-drawing@1.0.3/dist/lightweight-charts-drawing.umd.js"></script>
</head>
<body>

    <!-- Tombol Alat Gambar -->
    <div id="toolbar">
        <button class="btn active" onclick="setTool(null, this)">Pan</button>
        <button class="btn" onclick="setTool('trend-line', this)">Garis</button>
        <button class="btn" onclick="setTool('rectangle', this)">Kotak</button>
        <button class="btn" onclick="setTool('fib-retracement', this)">Fibo</button>
    </div>

    <div id="chart-container"></div>

    <script>
        // ==========================================
        // 1. GENERATE DATA DUMMY (Dengan Gap Weekend)
        // ==========================================
        const data = [];
        let baseTime = 1293840000; // 1 Jan 2011
        let price = 1400;
        
        for (let i = 0; i < 50; i++) {
            // Buat gap di index ke 25 (simulasi weekend)
            if (i === 25) {
                baseTime += 48 * 60 * 60; // Lompat 48 jam
            } else {
                baseTime += 5 * 60; // 5 menit
            }
            
            price = price + (Math.random() - 0.5) * 2;
            data.push({
                time: baseTime,
                open: price,
                high: price + Math.random(),
                low: price - Math.random(),
                close: price + (Math.random() - 0.5)
            });
        }

        // ==========================================
        // 2. INISIALISASI CHART
        // ==========================================
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: container.clientHeight,
            layout: { background: { color: '#1e1e1e' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            timeScale: { 
                timeVisible: true, 
                secondsVisible: false,
                borderColor: '#485c7b',
                rightOffset: 5,
                barSpacing: 10
            },
            // PENGATURAN SKALA BEBAS
            rightPriceScale: {
                autoScale: false, // Mematikan auto-scale
                borderColor: '#485c7b',
                scaleMargins: { top: 0.1, bottom: 0.1 },
            },
            // PENGATURAN INTERAKSI (Kunci Gestur)
            handleScale: {
                axisPressedMouseMove: {
                    time: true,
                    price: true // Mengizinkan tarik sumbu Y dengan jari
                },
                mouseWheel: true,
                pinch: true // Zoom pakai 2 jari
            },
            handleScroll: {
                mouseWheel: true,
                pressedMouseMove: true,
                horzTouchDrag: true,
                vertTouchDrag: false // Mematikan geser vertikal di area candle
            }
        });

        // Tambah Candlestick
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });
        candlestickSeries.setData(data);
        chart.timeScale().fitContent();

        // ==========================================
        // 3. SETUP ALAT GAMBAR (PLUGIN)
        // ==========================================
        let drawingManager = null;
        
        // Cek apakah plugin berhasil dimuat
        if (typeof LightweightChartsDrawing !== 'undefined') {
            drawingManager = new LightweightChartsDrawing.DrawingManager(chart, candlestickSeries);
        } else {
            alert("Plugin gambar gagal dimuat. Cek koneksi internet.");
        }

        function setTool(toolName, btn) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (!drawingManager) return;
            
            if (toolName === null) {
                drawingManager.disable(); // Mode Pan
            } else {
                drawingManager.setTool(toolName); // Aktifkan alat
            }
        }
    </script>
</body>
</html>
