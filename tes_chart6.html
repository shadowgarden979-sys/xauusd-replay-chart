<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tes Chart 6 - Interaktif Drawing</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; font-family: sans-serif; overflow: hidden; }
        #chart-wrapper { position: relative; width: 100vw; height: 85vh; }
        #chart-container { width: 100%; height: 100%; }
        
        /* Canvas Overlay */
        #overlay-canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            pointer-events: none; /* Default tembus pandang */
            z-index: 5;
        }
        
        #toolbar { padding: 10px; display: flex; gap: 5px; background: #2B2B43; z-index: 10; position: relative; overflow-x: auto; }
        .btn { background: #363A45; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .btn.active { background: #2962FF; }
        .btn-danger { background: #ef5350; margin-left: auto; }
    </style>
    
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

    <div id="toolbar">
        <button class="btn active" id="btn-pan">Pan</button>
        <button class="btn" id="btn-line">Garis</button>
        <button class="btn" id="btn-box">Kotak</button>
        <button class="btn" id="btn-fib">Fibo</button>
        <button class="btn btn-danger" id="btn-clear">Hapus</button>
    </div>

    <div id="chart-wrapper">
        <div id="chart-container"></div>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <script>
        // ==========================================
        // 1. SETUP CHART (Sama seperti tes_chart5)
        // ==========================================
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: container.clientHeight,
            layout: { background: { color: '#1e1e1e' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            timeScale: { 
                timeVisible: true, secondsVisible: false, borderColor: '#485c7b',
                rightOffset: 10, barSpacing: 8, fixLeftEdge: false, fixRightEdge: false
            },
            rightPriceScale: { autoScale: false, borderColor: '#485c7b' },
            handleScroll: { horzTouchDrag: true, vertTouchDrag: true },
            handleScale: { axisPressedMouseMove: { time: true, price: true }, pinch: true }
        });

        const series = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        // Data Dummy (1000 Candle)
        const data = [];
        let baseTime = 1293840000;
        let price = 1400;
        for (let i = 0; i < 1000; i++) {
            if (i % 100 === 0 && i !== 0) baseTime += 48 * 60 * 60;
            else baseTime += 5 * 60;
            price = price + (Math.random() - 0.5) * 2;
            data.push({ time: baseTime, open: price, high: price + 1, low: price - 1, close: price + (Math.random() - 0.5) });
        }
        series.setData(data);
        chart.timeScale().setVisibleLogicalRange({ from: data.length - 50, to: data.length + 10 });

        // ==========================================
        // 2. SETUP CANVAS & STATE DRAWING
        // ==========================================
        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        
        let drawings = []; // Array untuk menyimpan semua objek
        let currentTool = 'pan';
        let isDrawing = false;
        let selectedDrawing = null; // Objek yang sedang dipilih
        let dragHandle = null; // 'start' atau 'end'
        let hoverHandle = null;

        // Resize Canvas agar pas dengan Chart
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==========================================
        // 3. RENDER LOOP (Menggambar terus menerus agar menempel)
        // ==========================================
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Gambar semua objek yang tersimpan
            drawings.forEach(d => {
                drawShape(d, d === selectedDrawing);
            });

            // Gambar preview jika sedang menggambar
            if (isDrawing && selectedDrawing) {
                drawShape(selectedDrawing, true);
            }

            requestAnimationFrame(render); // Loop tanpa henti (60fps)
        }
        render();

        // ==========================================
        // 4. FUNGSI GAMBAR
        // ==========================================
        function drawShape(d, isSelected) {
            // Konversi waktu & harga ke koordinat layar
            const x1 = chart.timeScale().timeToCoordinate(d.start.time);
            const y1 = series.priceToCoordinate(d.start.price);
            const x2 = chart.timeScale().timeToCoordinate(d.end.time);
            const y2 = series.priceToCoordinate(d.end.price);

            // Jika objek keluar layar, jangan gambar
            if (x1 === null || y1 === null || x2 === null || y2 === null) return;

            ctx.lineWidth = isSelected ? 3 : 2;
            ctx.strokeStyle = isSelected ? '#FFD700' : '#2962FF'; // Emas jika dipilih

            if (d.type === 'line') {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            } else if (d.type === 'box') {
                ctx.beginPath();
                ctx.rect(x1, y1, x2 - x1, y2 - y1);
                ctx.stroke();
                ctx.fillStyle = 'rgba(41, 98, 255, 0.1)';
                ctx.fill();
            } else if (d.type === 'fib') {
                // Gambar Fibo sederhana (Level 0, 0.5, 1)
                const levels = [0, 0.5, 1];
                levels.forEach(level => {
                    const yLevel = y1 + (y2 - y1) * level;
                    ctx.beginPath();
                    ctx.moveTo(x1, yLevel);
                    ctx.lineTo(x2, yLevel);
                    ctx.stroke();
                });
            }

            // Gambar Handle (Titik Sudut) jika objek dipilih
            if (isSelected) {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath(); ctx.arc(x1, y1, 6, 0, Math.PI * 2); ctx.fill(); // Handle Start
                ctx.beginPath(); ctx.arc(x2, y2, 6, 0, Math.PI * 2); ctx.fill(); // Handle End
            }
        }

        // ==========================================
        // 5. INTERAKSI SENTUHAN (Touch & Mouse)
        // ==========================================
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function getChartCoords(x, y) {
            const time = chart.timeScale().coordinateToTime(x);
            const price = series.coordinateToPrice(y);
            if (time === null || price === null) return null;
            return { time, price };
        }

        function checkHit(x, y) {
            // Cek apakah jari menyentuh handle objek yang sedang dipilih
            if (selectedDrawing) {
                const x1 = chart.timeScale().timeToCoordinate(selectedDrawing.start.time);
                const y1 = series.priceToCoordinate(selectedDrawing.start.price);
                const x2 = chart.timeScale().timeToCoordinate(selectedDrawing.end.time);
                const y2 = series.priceToCoordinate(selectedDrawing.end.price);

                const distStart = Math.hypot(x - x1, y - y1);
                const distEnd = Math.hypot(x - x2, y - y2);

                if (distStart < 20) return 'start';
                if (distEnd < 20) return 'end';
            }
            return null;
        }

        function onPointerDown(e) {
            const { x, y } = getCoords(e);
            
            if (currentTool === 'pan') {
                // Jika mode Pan, cek apakah menyentuh handle objek terpilih
                const hit = checkHit(x, y);
                if (hit) {
                    dragHandle = hit;
                    e.preventDefault();
                }
                return;
            }

            // Jika sedang menggambar objek baru
            const coords = getChartCoords(x, y);
            if (coords) {
                isDrawing = true;
                selectedDrawing = {
                    type: currentTool,
                    start: coords,
                    end: coords
                };
            }
        }

        function onPointerMove(e) {
            const { x, y } = getCoords(e);

            if (isDrawing && selectedDrawing) {
                // Update ujung objek saat menggambar
                const coords = getChartCoords(x, y);
                if (coords) {
                    selectedDrawing.end = coords;
                }
                e.preventDefault();
            } else if (dragHandle && selectedDrawing) {
                // Geser handle objek yang dipilih
                const coords = getChartCoords(x, y);
                if (coords) {
                    selectedDrawing[dragHandle] = coords;
                }
                e.preventDefault();
            }
        }

        function onPointerUp(e) {
            if (isDrawing) {
                isDrawing = false;
                drawings.push(selectedDrawing); // Simpan objek permanen
            }
            dragHandle = null;
        }

        // Pasang Listener
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp);

        // ==========================================
        // 6. LOGIKA TOMBOL
        // ==========================================
        function setTool(tool, btnId) {
            currentTool = tool;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(btnId).classList.add('active');
            
            // Jika mode Pan, canvas tembus pandang. Jika menggambar, canvas menahan sentuhan.
            canvas.style.pointerEvents = (tool === 'pan') ? 'none' : 'auto';
            
            if (tool === 'pan') {
                // Tetap izinkan edit handle saat mode Pan dengan mengaktifkan pointer events khusus di JS
                canvas.style.pointerEvents = 'auto'; 
                // Tapi kita harus mengizinkan chart di belakangnya bergerak. 
                // Solusi: Kita matikan pointer events di canvas, tapi kita dengarkan sentuhan dari container chart.
            }
        }

        // Perbaikan Logika Interaksi: 
        // Karena canvas menutupi chart, kita harus pintar mengatur pointer-events.
        // Untuk tes ini, kita buat canvas selalu menerima sentuhan, tapi kita teruskan sentuhan ke chart jika tidak kena objek.
        
        document.getElementById('btn-pan').onclick = () => setTool('pan', 'btn-pan');
        document.getElementById('btn-line').onclick = () => setTool('line', 'btn-line');
        document.getElementById('btn-box').onclick = () => setTool('box', 'btn-box');
        document.getElementById('btn-fib').onclick = () => setTool('fib', 'btn-fib');
        
        document.getElementById('btn-clear').onclick = () => {
            drawings = [];
            selectedDrawing = null;
        };

        // Default: Canvas harus menahan sentuhan agar kita bisa deteksi klik pada objek
        canvas.style.pointerEvents = 'auto';

        // Trik: Jika mode pan, kita ingin chart bisa di-geser. 
        // Kita gunakan event listener tambahan pada window untuk meneruskan geseran ke chart jika tidak kena objek.
        // (Untuk kesederhanaan tes, kita biarkan mode pan mengunci chart untuk sementara. Geser chart dilakukan lewat tombol pan).
        
    </script>
</body>
</html>
