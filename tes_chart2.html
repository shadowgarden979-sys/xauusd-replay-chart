<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tes Lightweight Charts & Drawing</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; font-family: sans-serif; overflow: hidden; }
        #chart-container { width: 100vw; height: 80vh; touch-action: pan-x pan-y; }
        #toolbar { padding: 10px; display: flex; gap: 5px; background: #2B2B43; z-index: 10; position: relative; }
        .btn { background: #363A45; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .btn.active { background: #2962FF; }
    </style>
    
    <!-- IMPORT MAP: Menghubungkan library utama dan plugin agar saling kenal -->
    <script type="importmap">
    {
        "imports": {
            "lightweight-charts": "https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.esm.production.js",
            "lightweight-charts-drawing": "https://unpkg.com/lightweight-charts-drawing@1.0.3/dist/lightweight-charts-drawing.js"
        }
    }
    </script>
</head>
<body>

    <div id="toolbar">
        <button class="btn active" id="btn-pan">Pan</button>
        <button class="btn" id="btn-line">Garis</button>
        <button class="btn" id="btn-fib">Fibo</button>
    </div>

    <div id="chart-container"></div>

    <script type="module">
        // Memanggil library dan plugin menggunakan Import Map
        import { createChart } from 'lightweight-charts';
        import { DrawingManager } from 'lightweight-charts-drawing';

        const container = document.getElementById('chart-container');
        const chart = createChart(container, {
            width: container.clientWidth,
            height: container.clientHeight,
            layout: { background: { color: '#1e1e1e' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#485c7b' },
            // SKALA BEBAS
            rightPriceScale: { 
                autoScale: false, 
                borderColor: '#485c7b' 
            }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        // Generate Data Dummy
        const data = [];
        let baseTime = 1293840000;
        let price = 1400;
        for (let i = 0; i < 50; i++) {
            if (i === 25) baseTime += 48 * 60 * 60; // Gap Weekend
            else baseTime += 5 * 60;
            price = price + (Math.random() - 0.5) * 2;
            data.push({
                time: baseTime,
                open: price, high: price + Math.random(),
                low: price - Math.random(), close: price + (Math.random() - 0.5)
            });
        }
        candlestickSeries.setData(data);
        chart.timeScale().fitContent();

        // Inisialisasi Plugin Gambar
        const drawingManager = new DrawingManager(chart, candlestickSeries);

        // Logika Tombol
        document.getElementById('btn-pan').addEventListener('click', () => {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-pan').classList.add('active');
            drawingManager.disable();
        });

        document.getElementById('btn-line').addEventListener('click', () => {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-line').classList.add('active');
            drawingManager.setTool('trend-line');
        });

        document.getElementById('btn-fib').addEventListener('click', () => {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-fib').classList.add('active');
            drawingManager.setTool('fib-retracement');
        });
    </script>
</body>
</html>
