<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Drawing Tools</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; font-family: sans-serif; overflow: hidden; }
        
        /* Container harus relative agar canvas bisa menumpuk di atasnya */
        #chart-wrapper { position: relative; width: 100vw; height: 80vh; }
        #chart-container { width: 100%; height: 100%; }
        
        /* Canvas transparan untuk menggambar */
        #overlay-canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            pointer-events: none; /* Default: tembus sentuhan agar chart bisa digeser */
            z-index: 5;
        }
        
        #toolbar { padding: 10px; display: flex; gap: 5px; background: #2B2B43; z-index: 10; position: relative; }
        .btn { background: #363A45; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .btn.active { background: #2962FF; }
    </style>
    
    <!-- Library Utama Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

    <div id="toolbar">
        <button class="btn active" id="btn-pan">Pan</button>
        <button class="btn" id="btn-line">Garis</button>
        <button class="btn" id="btn-box">Kotak</button>
        <button class="btn" id="btn-clear" style="margin-left: auto; background: #ef5350;">Hapus</button>
    </div>

    <div id="chart-wrapper">
        <div id="chart-container"></div>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <script>
        // 1. SETUP CHART & DATA
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight,
            layout: { background: { color: '#1e1e1e' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#485c7b' },
            rightPriceScale: { autoScale: false, borderColor: '#485c7b' }, // Skala Bebas
            handleScroll: { horzTouchDrag: true, vertTouchDrag: false }, // Geser kiri/kanan
            handleScale: { axisPressedMouseMove: { price: true } } // Tarik Y-axis
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        // Data Dummy
        const data = [];
        let baseTime = 1293840000;
        let price = 1400;
        for (let i = 0; i < 50; i++) {
            if (i === 25) baseTime += 48 * 60 * 60;
            else baseTime += 5 * 60;
            price = price + (Math.random() - 0.5) * 2;
            data.push({ time: baseTime, open: price, high: price + 1, low: price - 1, close: price + (Math.random() - 0.5) });
        }
        candlestickSeries.setData(data);
        chart.timeScale().fitContent();

        // 2. SETUP CANVAS OVERLAY
        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        let drawings = []; // Menyimpan riwayat gambar
        let currentTool = 'pan';
        let isDrawing = false;
        let startPoint = null;
        let currentPoint = null;

        // Sesuaikan ukuran canvas dengan chart
        function resizeCanvas() {
            canvas.width = chartContainer.clientWidth;
            canvas.height = chartContainer.clientHeight;
            drawAll();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 3. FUNGSI MENGGAMBAR
        function drawAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#2962FF';

            // Gambar yang sudah tersimpan
            drawings.forEach(d => drawShape(d));

            // Gambar yang sedang dibuat (preview)
            if (isDrawing && startPoint && currentPoint) {
                drawShape({ type: currentTool, start: startPoint, end: currentPoint });
            }
        }

        function drawShape(d) {
            // Konversi Waktu & Harga ke Piksel (X, Y)
            const x1 = chart.timeScale().timeToCoordinate(d.start.time);
            const y1 = candlestickSeries.priceToCoordinate(d.start.price);
            const x2 = chart.timeScale().timeToCoordinate(d.end.time);
            const y2 = candlestickSeries.priceToCoordinate(d.end.price);

            if (x1 === null || y1 === null || x2 === null || y2 === null) return;

            ctx.beginPath();
            if (d.type === 'line') {
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
            } else if (d.type === 'box') {
                ctx.rect(x1, y1, x2 - x1, y2 - y1);
            }
            ctx.stroke();
        }

        // 4. LOGIKA SENTUHAN (Touch & Mouse)
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function onPointerDown(e) {
            if (currentTool === 'pan') return;
            e.preventDefault();
            const { x, y } = getCoords(e);
            const time = chart.timeScale().coordinateToTime(x);
            const price = candlestickSeries.coordinateToPrice(y);
            
            if (time !== null && price !== null) {
                isDrawing = true;
                startPoint = { time, price };
                currentPoint = { time, price };
            }
        }

        function onPointerMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const { x, y } = getCoords(e);
            const time = chart.timeScale().coordinateToTime(x);
            const price = candlestickSeries.coordinateToPrice(y);
            
            if (time !== null && price !== null) {
                currentPoint = { time, price };
                drawAll();
            }
        }

        function onPointerUp(e) {
            if (!isDrawing) return;
            isDrawing = false;
            drawings.push({ type: currentTool, start: startPoint, end: currentPoint });
            startPoint = null;
            currentPoint = null;
            drawAll();
        }

        // Pasang Event Listener ke Canvas
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp);

        // 5. TOMBOL TOOLBAR
        function setTool(tool, btnId) {
            currentTool = tool;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(btnId).classList.add('active');
            
            // Jika mode Pan, biarkan sentuhan tembus ke chart. Jika menggambar, tahan sentuhan di canvas.
            canvas.style.pointerEvents = (tool === 'pan') ? 'none' : 'auto'; 
        }

        document.getElementById('btn-pan').onclick = () => setTool('pan', 'btn-pan');
        document.getElementById('btn-line').onclick = () => setTool('line', 'btn-line');
        document.getElementById('btn-box').onclick = () => setTool('box', 'btn-box');
        
        document.getElementById('btn-clear').onclick = () => {
            drawings = [];
            drawAll();
        };

        // 6. SINKRONISASI (Gambar ikut bergeser saat chart di-zoom/pan)
        chart.timeScale().subscribeVisibleTimeRangeChange(() => {
            drawAll();
        });

    </script>
</body>
</html>
